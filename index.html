<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Registro de Venta - Kigo</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef1ed;-webkit-text-size-adjust:100%}
.app{max-width:900px;margin:0 auto;background:#f5f5f5;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:90px}
.card{background:#fff;border-radius:20px;margin:12px 14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.top-line{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:#666;margin-bottom:10px}
.title{color:#0a7a2e;font-weight:900;font-size:28px;letter-spacing:-.5px;margin:6px 0 16px}
.title-h{color:#111827;font-weight:900;font-size:32px;letter-spacing:-.5px;margin:0}
.sub-h{color:#6b7280;font-size:14px;margin:4px 0 16px}
.label{font-size:13px;font-weight:500;color:#333;margin:14px 0 6px}
.input-wrap{position:relative;display:flex;align-items:center}
.input{width:100%;padding:12px 38px 12px 14px;border:1.5px solid #ddd;border-radius:12px;font-size:14px;background:#fff;outline:none}
.input:focus{border-color:#0a7a2e}
.btn-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#999;cursor:pointer;z-index:2}
.tipo-box{display:flex;gap:8px}
.tipo{flex:1;padding:11px;border-radius:12px;border:1.5px solid #0a7a2e;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.tipo.active{background:#0a7a2e;color:#fff}
.total-box{background:#d1e7d6;border:1.5px solid #a3c9a8;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.btn-reg{width:100%;margin-top:16px;background:#0a7a2e;color:#fff;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:900px;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0 12px;z-index:10}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#888;cursor:pointer;font-weight:600;border:none;background:transparent}
.nav-item.active{color:#0a7a2e}
.filtros-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtro-tab{padding:10px 16px;border-radius:12px;border:1.5px solid #d1d5db;background:#fff;font-weight:600;font-size:13px;cursor:pointer}
.filtro-tab.active{background:#0a9a4a;color:#fff;border-color:#0a9a4a}
.meses-title{font-size:12px;font-weight:700;color:#6b7280;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.meses-box{display:flex;gap:6px;flex-wrap:wrap}
.mes{padding:8px 12px;border-radius:10px;border:1.5px solid #d1d5db;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.mes.active{background:#0a9a4a;color:#fff;border-color:#0a9a4a}
.barra-filtros{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.search-input{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #d1d5db;border-radius:10px;padding:8px 12px;flex:1;min-width:140px}
.search-input input,.search-input select{border:none;outline:none;font-size:13px;width:100%;background:transparent}
.btn-limpiar{background:#0a9a4a;color:#fff;border:none;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabla-wrap{overflow:auto;margin-top:14px;border-radius:12px;border:1px solid #eee;max-height:520px;overflow-y:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th{font-size:11px;color:#6b7280;background:#f9fafb;padding:10px 12px;text-align:left;font-weight:700;position:sticky;top:0;z-index:1}
td{padding:10px 12px;font-size:13px;border-top:1px solid #f0f0f0;vertical-align:middle}
.badge-pagado{background:#0a9a4a;color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border:none}
.badge-debe{background:#dc2626;color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.acc-btn{width:30px;height:30px;border-radius:8px;border:1px solid #ddd;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-right:4px}
#overlayExito,#overlayEdit,#overlayDel,#overlayCliEdit,#overlayCliDel,#overlayRepEdit,#overlayRepDel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.card-modal{background:#fff;border-radius:20px;padding:22px;width:95%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop.25s ease;max-height:92vh;overflow:auto}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.btn-si{background:#dc2626;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;flex:1;cursor:pointer}
.btn-no{background:#0a9a4a;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;flex:1;cursor:pointer}
.clientes-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}
.c-tab{padding:9px 16px;border-radius:50px;border:1.5px solid #d1d5db;background:#d1d5db;white-space:nowrap;font-weight:700;font-size:13px;color:#6b7280;display:flex;align-items:center;gap:6px;cursor:pointer}
.c-tab.active{background:#fff;border-color:#0a9a4a;color:#0a7a2e;box-shadow:0 0 10px rgba(10,154,74,.22)}
.stats-clientes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:radial-gradient(ellipse at top, #1a2e1f 0%, #000 65%);border:1.5px solid #0a9a4a;border-radius:14px;padding:14px 12px;color:#fff;box-shadow:0 0 14px rgba(10,154,74,.28)}
.s-top{display:flex;align-items:center;gap:6px;font-size:11px;color:#86efac;font-weight:600}
.s-num{font-size:30px;font-weight:900;text-align:center;margin:4px 0 1px;line-height:1}
.s-sub{font-size:10px;text-align:center;color:#a7f3d0}
.cliente-row{background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:8px}
.cliente-row-left{flex:1.4;overflow:hidden}
.cliente-row-mid{display:flex;gap:18px;align-items:center;flex:1;justify-content:flex-start;margin-left:10px}
.c-name{font-weight:800;font-size:12px;color:#111827;margin-bottom:2px}
.c-meta{display:flex;align-items:center;gap:4px;font-size:9.5px;color:#374151;margin-top:2px}
.c-label{font-size:9px;color:#6b7280}
.c-label.green{color:#0a7a2e;font-weight:700;font-size:9px}
.c-val{font-size:13px;font-weight:700;color:#374151}
.c-val.green{color:#111827;font-size:13px;font-weight:800}
.rank-row{background:#fff;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.05);margin-bottom:6px}
.suggest-box{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #ddd;border-radius:12px;margin-top:6px;z-index:50;max-height:180px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.12);display:none}
.suggest-item{padding:10px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f3f4f6}
.suggest-item:hover{background:#f0fdf4}
.portal-title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;color:#2d3a2e;margin-bottom:16px}
.portal-icon{width:32px;height:32px;background:#d6ecc0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rep-tabs{display:flex;justify-content:center;gap:24px;margin-bottom:18px;flex-wrap:wrap}
.rep-tab{padding:8px 18px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:14px;cursor:pointer;background:transparent;color:#6b7280}
.rep-tab.active{background:#fff;border-color:#6fbf8a;color:#0a7a2e;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.rep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.rep-stat{background:#fff;border:1.5px solid #6fbf8a;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.rep-stat-icon{width:36px;height:36px;background:#d6ecc0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#2d5a2e}
.rep-stat-num{font-size:20px;font-weight:800;color:#2d3a2e;line-height:1}
.rep-stat-label{font-size:11px;color:#4b5563}
.rep-list-header{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;flex-wrap:wrap;gap:8px}
.rep-search{flex:1;max-width:320px;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #ddd;border-radius:18px;padding:6px 10px}
.rep-row{background:#fff;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 6px rgba(0,0,0,.05);margin-bottom:6px;flex-wrap:wrap}
.rep-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;overflow:hidden;background:#c8e8b5}
.rep-info{flex:1;min-width:120px}
.rep-name{font-weight:800;font-size:12px;color:#111827}
.rep-sub{font-size:10px;color:#4b5563;display:flex;align-items:center;gap:3px;margin-top:1px}
.rep-badges{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.rep-badge{background:#d6ecc0;color:#065f46;border-radius:12px;padding:3px 7px;font-size:10px;font-weight:700}
.rep-status{border-radius:12px;padding:4px 8px;font-size:10px;font-weight:700;border:none;cursor:pointer}
.rep-status.disp{background:#10b981;color:#fff}
.rep-status.inact{background:#dc2626;color:#fff}
.rep-btn{border:1px solid #d1d5db;background:#fff;border-radius:16px;padding:4px 8px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:3px;cursor:pointer}
.foto-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #6fbf8a;display:none;margin-top:8px}
.presu-header{background:#fff;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:18px}
.presu-title{font-weight:800;font-size:24px;color:#2d3a2e}
.presu-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.presu-tab{padding:10px 18px;border-radius:14px;border:1.5px solid transparent;background:#e5e7eb;color:#4b5563;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.presu-tab.active{background:#10b981;color:#fff;border-color:#10b981;box-shadow:0 4px 12px rgba(16,185,129,.35)}
.presu-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.presu-stat{background:#fff;border-radius:14px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px}
.presu-stat-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.presu-icon-green{background:#c8e8b5;color:#0a7a2e}
.presu-icon-orange{background:#ffdb99;color:#b45309}
.presu-stat-label{font-size:12px;color:#6b7280}
.presu-stat-num{font-size:22px;font-weight:900;color:#2d3a2e;line-height:1.1}
.presu-stat-sub{font-size:10px;color:#6b7280;margin-top:2px}
.presu-detalle{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.presu-detalle-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.presu-filtro{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.presu-date{border:1.5px solid #d1d5db;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;background:#fff;display:flex;align-items:center;gap:6px}
.presu-select{border:1.5px solid #10b981;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;background:#f0fdf4;width:100%;max-width:280px;outline:none}
.presu-table{overflow:auto}
.presu-table table{width:100%;border-collapse:collapse;min-width:650px}
.presu-table th{font-size:11px;color:#6b7280;background:#f3f4f6;padding:8px 10px;text-align:left}
.presu-table td{padding:8px 10px;font-size:12px;border-top:1px solid #f0f0f0}
.presu-rep{display:flex;align-items:center;gap:8px}
.presu-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;flex-shrink:0}
.presu-badge{border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;border:none}
.presu-badge.debe{background:#fed7aa;color:#9a3412}
.presu-badge.pagado{background:#10b981;color:#fff}
.cal-nav{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cal-btn{border:1.5px solid #10b981;background:#f0fdf4;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;color:#065f46}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:6px;min-height:64px;text-align:center}
.cal-day.hoy{border:2px solid #10b981;background:#f0fdf4}
.cal-day-num{font-weight:800;font-size:12px;color:#111827}
.cal-day-ped{font-size:9px;color:#0a7a2e;font-weight:700;margin-top:2px}
.cal-day-ing{font-size:8px;color:#6b7280;margin-top:1px}
.cal-head{font-size:10px;font-weight:800;color:#6b7280;text-align:center;padding:4px}
@media(max-width:700px){.presu-stats{grid-template-columns:1fr}.rep-stats{grid-template-columns:1fr}.stats-clientes{grid-template-columns:1fr}}
@media(max-width:480px){
 .card{margin:6px 6px;padding:10px;border-radius:14px}
 .title{font-size:18px;margin:2px 0 8px}
 .title-h{font-size:19px}
 .presu-title{font-size:16px}
 .portal-title{font-size:16px}
 .label{font-size:11px;margin:8px 0 3px}
 .input{padding:8px 28px 8px 10px;font-size:12px;border-radius:10px}
 .tipo{padding:6px;font-size:10px;gap:4px}
 .btn-reg{padding:9px;font-size:12px;border-radius:10px}
 .total-box{padding:6px 10px}
 #totalTxt{font-size:18px !important}
 .filtro-tab{padding:5px 8px;font-size:10px;border-radius:8px}
 .mes{padding:5px 7px;font-size:10px}
 .c-tab{padding:5px 9px;font-size:10px}
 .presu-tab{padding:6px 10px;font-size:10px}
 .rep-tab{padding:5px 9px;font-size:10px}
 .search-input{padding:5px 8px;min-width:90px}
 .search-input input,.search-input select{font-size:10px}
 .nav-item{font-size:8px}
 .tabla-wrap{max-height:300px}
 th{font-size:9px;padding:6px 6px}
 td{font-size:10px;padding:6px 6px}
 .stat-card{padding:8px 8px}
 .s-num{font-size:18px}
 .presu-stat{padding:10px}
 .presu-stat-num{font-size:16px}
 .presu-stat-icon{width:32px;height:32px}
 .cal-day{min-height:52px;padding:4px}
 .cal-day-num{font-size:10px}
 .cal-day-ped{font-size:8px}
 .cal-day-ing{font-size:7px}
 .cal-btn{padding:6px 10px;font-size:10px}
}
