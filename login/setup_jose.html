<!DOCTYPE html>
<html>
<head><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script></head>
<body>
<button onclick="crearJose()" style="padding:20px;font-size:18px">CREAR/ACTUALIZAR JOSE USUARIO Jose / 1111</button>
<script>
const firebaseConfig = { apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM", authDomain: "registro-ventas-kigo.firebaseapp.com", databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com", projectId: "registro-ventas-kigo", storageBucket: "registro-ventas-kigo.firebasestorage.app", messagingSenderId: "494693818399", appId: "1:494693818399:web:34312307ec5cd52190752a" };
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
function crearJose(){
  db.ref('repartidores').once('value').then(s=>{
    const data=s.val()||{};
    let keyJose=null;
    Object.keys(data).forEach(k=>{
      if((data[k].nombre||'').toLowerCase()==='jose'){ keyJose=k; }
    });
    if(keyJose){
      db.ref(`repartidores/${keyJose}`).update({ usuario:'Jose', contraseña:'1111', password:'1111', estado:'Activo' }).then(()=>alert('Jose actualizado: usuario Jose / contraseña 1111 en key '+keyJose));
    } else {
      db.ref('repartidores').push({ nombre:'Jose', moto:'Honda CB125', precioMandado:5, precioTransporte:10, usuario:'Jose', contraseña:'1111', password:'1111', estado:'Activo', foto:'' }).then(()=>alert('Jose creado: usuario Jose / 1111'));
    }
  });
}
</script>
</body>
</html>
