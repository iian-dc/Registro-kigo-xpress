<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial - Kigo Xpress</title>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',sans-serif}
body{background:#f5f5f5;zoom:0.88}
.top{height:56px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:50}
.btn-x{width:32px;height:32px;background:#E10600;border:none;color:#fff;border-radius:8px;font-weight:800;cursor:pointer}
.logo-text{color:#fff;font-weight:800;font-size:14px}.red{color:#E10600}.logo-sub{color:#a3a3a3;font-size:8px}
.main{padding:10px}
.head-sec,.filters,.table-wrap{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.head-sec{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp-f{border:1px solid #e5e7eb;border-radius:999px;padding:0 10px;height:34px;display:flex;align-items:center;background:#fff}
.inp-f input,.inp-f select{border:none;outline:none;font-size:11.5px;background:transparent;width:100%}
.search-box{border:1px solid #e5e7eb;border-radius:999px;padding:0 12px;height:34px;display:flex;align-items:center;gap:6px;flex:1;min-width:180px;background:#f9fafb}
.search-box input{border:none;outline:none;font-size:11.5px;width:100%;background:transparent}
.btn-buscar{background:#111;color:#fff;border-radius:999px;border:none;padding:0 14px;height:34px;font-weight:700;font-size:11px;cursor:pointer}
.total-ped{background:#E10600;color:#fff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:800}
.table-wrap{overflow-x:auto;padding:0}
.table{width:100%;border-collapse:collapse;min-width:1020px}
.table th{font-size:10px;font-weight:800;color:#6b7280;text-transform:uppercase;padding:10px 8px;background:#fafafa;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-align:left}
.table td{font-size:11px;padding:8px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
.badge-serv{border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;display:inline-flex;letter-spacing:0.3px}
.badge-moto{background:#ff0033;color:#fff;box-shadow:0 0 8px rgba(255,0,51,0.7);border:1px solid #ff3355}
.badge-trans{background:#ffe600;color:#111;box-shadow:0 0 10px rgba(255,230,0,0.8);border:1px solid #fff176}
.badge-pago{border-radius:999px;padding:5px 12px;font-weight:800;font-size:10px;display:inline-flex;cursor:pointer;border:none}
.badge-pago-si{background:#16a34a;color:#fff}.badge-pago-no{background:#E10600;color:#fff}
.badge-estado{border-radius:999px;padding:4px 10px;font-weight:800;font-size:10px;display:inline-flex}
.pagado{background:#16a34a;color:#fff}.debe{background:#E10600;color:#fff}
.act{display:flex;gap:4px}.btn-act{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer}
.btn-edit{background:#facc15}.btn-del{background:#111;color:#fff}
.footer-table{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:10px;color:#94a3b8;border-top:1px solid #eee}
.pag{display:flex;gap:4px}.pag button{width:24px;height:24px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}.pag button.active{background:#E10600;color:#fff;border-color:#E10600}
.aviso-slide{display:none;justify-content:center;font-size:10px;color:#E10600;font-weight:700;padding:4px 0 8px}
@media(max-width:768px){.filters{flex-direction:column;align-items:stretch}.inp-f,.search-box{width:100%}.aviso-slide{display:flex!important}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:360px}.modal input,.modal select{width:100%;padding:9px 12px;border-radius:999px;border:1px solid #e5e7eb;margin-bottom:8px;font-size:12px}.modal-actions{display:flex;gap:6px;justify-content:flex-end}.btn-save{background:#E10600;color:#fff;border-radius:999px;padding:8px 14px;border:none;font-weight:700;cursor:pointer}.btn-cancel{background:#f3f4f6;border-radius:999px;padding:8px 14px;border:none}
</style>
</head>
<body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn-x" onclick="location.href='admin.html'">✕</button><div><div class="logo-text">Kigo <span class="red">X</span>press</div><div class="logo-sub">LA SOLUCIÓN A TU ALCANCE</div></div></div><div class="total-ped" id="totalPed">Total: 0</div></div>
<div class="main">
<div class="head-sec"><div><h1 style="font-size:14px;font-weight:800">Historial de pedidos</h1><p style="font-size:11px;color:#6b7280">Valor = servicio | Pago = tarifa congelada por pedido</p></div><button class="btn-buscar" style="background:#fff;color:#111;border:1px solid #e5e7eb" onclick="location.reload()">Actualizar</button></div>
<div class="filters"><div class="inp-f"><input type="date" id="fIni"><input type="date" id="fFin" style="margin-left:4px;border-left:1px solid #eee;padding-left:6px"></div><div class="inp-f"><select id="fMes"><option value="">Mes</option><option value="1">Enero</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Abr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Ago</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option></select></div><div class="search-box"><input id="fBuscar" placeholder="Buscar aliado..."></div><button class="btn-buscar" onclick="aplicarFiltros()">Buscar</button></div>
<div class="aviso-slide">← Desliza para ver más →</div>
<div class="table-wrap" id="wrapTabla"><table class="table"><thead><tr><th>Fecha</th><th>N° Pedido</th><th>Aliado</th><th>Servicio</th><th>Repartidor</th><th>Valor</th><th>Pago</th><th>Total</th><th>¿Ya pagó?</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tbody"></tbody></table><div class="footer-table"><span id="footerInfo">0 pedidos</span><div class="pag"><button onclick="cambiarPag(-1)">‹</button><button class="active" id="pagNum">1</button><button onclick="cambiarPag(1)">›</button></div></div></div>
</div>
<div id="modalEdit" class="modal-bg"><div class="modal"><h3>Editar</h3><input id="eCliente"><select id="eTipo"><option value="moto">Moto mandado</option><option value="transporte">Moto transporte</option></select><input id="eRepa"><input id="eValor" type="number"><select id="ePagado"><option value="si">Sí</option><option value="no">No</option></select><div class="modal-actions"><button class="btn-cancel" onclick="cerrarModal()">Cancelar</button><button class="btn-save" onclick="guardarEdicion()">Guardar</button></div></div></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM", authDomain: "registro-ventas-kigo.firebaseapp.com", databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com", projectId: "registro-ventas-kigo", storageBucket: "registro-ventas-kigo.firebasestorage.app", messagingSenderId: "494693818399", appId: "1:494693818399:web:34312307ec5cd52190752a" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let ventas=[], filtradas=[], pagina=1, porPag=30, editId=null, primeraCarga=true;
let repartidoresMap={};

db.ref('repartidores').on('value', snap=>{
  const v=snap.val()||{};
  repartidoresMap={};
  Object.values(v).forEach(r=>{
    const key=(r.nombre||'').toLowerCase().trim();
    if(key) repartidoresMap[key]=r;
  });
  if(ventas.length>0) render();
});

function getTarifaCongelada(v){
  // 1. Si el pedido ya tiene tarifaCongelada guardada, usar esa (no cambia nunca)
  if(v.tarifaCongelada!=null && v.tarifaCongelada!=='') return parseInt(v.tarifaCongelada);
  // 2. Si ya estaba pagado, usar el pago que ya tenía
  if(v.pago>0) return parseInt(v.pago);
  if(v.descuento>0) return parseInt(v.descuento);
  // 3. Si es pedido viejo sin tarifa guardada, default 5 y 10
  const esTrans=(v.tipo||'').toLowerCase().includes('trans');
  return esTrans?10:5;
}

function getTarifaActualParaNuevo(nombreRepa, tipo){
  const key=(nombreRepa||'').toLowerCase().trim();
  const rep=repartidoresMap[key];
  const esTrans=(tipo||'').toLowerCase().includes('trans');
  if(rep){
    if(esTrans){
      if(rep.tarifaTransporte!=null && rep.tarifaTransporte!=='') return parseInt(rep.tarifaTransporte);
      if(rep.precioTransporte!=null && rep.precioTransporte!=='') return parseInt(rep.precioTransporte);
    }else{
      if(rep.tarifaMandado!=null && rep.tarifaMandado!=='') return parseInt(rep.tarifaMandado);
      if(rep.precioMandado!=null && rep.precioMandado!=='') return parseInt(rep.precioMandado);
    }
  }
  return esTrans?10:5;
}

db.ref('ventas').on('value', snap=>{
 const val=snap.val()||{};
 const scrollLeft = document.getElementById('wrapTabla')?.scrollLeft || 0;
 const scrollY = window.scrollY;
 const prevPag = pagina;
 let lista=Object.entries(val).map(([id,d])=>({id,...d}));
 if(lista.length===0){ ventas=[]; filtradas=[]; render(); return; }
 lista.sort((a,b)=>{
   const fa=a.fecha||''; const fb=b.fecha||'';
   if(fa!==fb) return fa.localeCompare(fb);
   return (a.timestamp||0)-(b.timestamp||0);
 });
 lista.forEach((item, idx)=>{ item.numeroSecuencial = idx+1; });
 ventas = [...lista].reverse();
 if(primeraCarga){
   filtradas=[...ventas];
   primeraCarga=false;
 }else{
   const ini=fIni.value, fin=fFin.value, mes=fMes.value, bus=fBuscar.value.toLowerCase().trim();
   filtradas=ventas.filter(v2=>{
    if(bus &&!(v2.cliente||'').toLowerCase().includes(bus)) return false;
    if(mes){ if(!v2.fecha) return false; if(parseInt(v2.fecha.split('-')[1])!==parseInt(mes)) return false; }
    if(ini && v2.fecha < ini) return false; if(fin && v2.fecha > fin) return false; return true;
   });
   pagina=prevPag;
 }
 render();
 setTimeout(()=>{ const w=document.getElementById('wrapTabla'); if(w) w.scrollLeft=scrollLeft; window.scrollTo(0,scrollY); },20);
});

function aplicarFiltros(){
 const ini=fIni.value, fin=fFin.value, mes=fMes.value, bus=fBuscar.value.toLowerCase().trim();
 filtradas=ventas.filter(v=>{
  if(bus &&!(v.cliente||'').toLowerCase().includes(bus)) return false;
  if(mes){ if(!v.fecha) return false; if(parseInt(v.fecha.split('-')[1])!==parseInt(mes)) return false; }
  if(ini && v.fecha < ini) return false; if(fin && v.fecha > fin) return false; return true;
 });
 pagina=1; render();
}
function formatFecha(f){ if(!f) return ''; if(f.includes('-')){const [y,m,d]=f.split('-');return `${d}/${m}/${y}`;}return f;}

function togglePago(id){
 const v=ventas.find(x=>x.id===id); if(!v) return;
 const isSi=v.yaPago===true || v.yaPago==='si' || v.yaPago==='Sí' || v.estado==='Pagado';
 const cobro = getTarifaCongelada(v);
 const scrollLeft = document.getElementById('wrapTabla').scrollLeft;
 const scrollY = window.scrollY;
 if(isSi){
   db.ref('ventas/'+id).update({yaPago:false, estado:'Debe', total:0});
 }else{
   // Al pagar, congelamos la tarifa para que no cambie nunca más
   db.ref('ventas/'+id).update({yaPago:true, estado:'Pagado', pago:cobro, descuento:cobro, total:cobro, tarifaCongelada:cobro});
 }
 setTimeout(()=>{ document.getElementById('wrapTabla').scrollLeft=scrollLeft; window.scrollTo(0,scrollY); },50);
}

function render(){
 const tbody=document.getElementById('tbody');
 if(!tbody) return;
 tbody.innerHTML='';
 const slice=filtradas.slice((pagina-1)*porPag, pagina*porPag);
 document.getElementById('totalPed').innerText=`Total: ${filtradas.length} pedidos`;
 document.getElementById('footerInfo').innerText=`Mostrando ${slice.length} de ${filtradas.length}`;
 document.getElementById('pagNum').innerText=pagina;
 if(slice.length===0){
   tbody.innerHTML=`<tr><td colspan="11" style="text-align:center;padding:20px;color:#9ca3af">No hay pedidos</td></tr>`;
   return;
 }
 slice.forEach(v=>{
  const esTrans=(v.tipo||'').toLowerCase().includes('trans');
  const isSi=v.yaPago===true || v.yaPago==='si' || v.yaPago==='Sí' || v.estado==='Pagado';
  const valorServicio=parseFloat(v.precio||v.valor||0);
  const cobro = getTarifaCongelada(v);
  const totalMostrar=isSi?cobro:0;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${formatFecha(v.fecha)}</td><td style="font-weight:800">#${v.numeroSecuencial||''}</td><td>${v.cliente||'-'}</td><td><span class="${esTrans?'badge-trans':'badge-moto'} badge-serv">${esTrans?'Transporte':'Mandado'}</span></td><td>${v.repartidor||'-'}</td><td>$${valorServicio.toFixed(0)}</td><td style="font-weight:800;color:#E10600">$${cobro.toFixed(0)}</td><td style="font-weight:800">$${totalMostrar.toFixed(0)}</td><td><button class="badge-pago ${isSi?'badge-pago-si':'badge-pago-no'}" onclick="togglePago('${v.id}')">${isSi?'✓ Sí':'✕ No'}</button></td><td><span class="badge-estado ${isSi?'pagado':'debe'}">${isSi?'Pagado':'Debe'}</span></td><td><div class="act"><button class="btn-act btn-edit" onclick="editar('${v.id}')">✎</button><button class="btn-act btn-del" onclick="eliminar('${v.id}')">🗑</button></div></td>`;
  tbody.appendChild(tr);
 });
}
function cambiarPag(d){ const max=Math.max(1,Math.ceil(filtradas.length/porPag)); pagina=Math.min(max,Math.max(1,pagina+d)); render(); window.scrollTo(0,0); }
function editar(id){ const v=ventas.find(x=>x.id===id); if(!v) return; editId=id; eCliente.value=v.cliente||''; eTipo.value=(v.tipo||'').includes('trans')?'transporte':'moto'; eRepa.value=v.repartidor||''; eValor.value=v.precio||0; ePagado.value=(v.yaPago===true||v.estado==='Pagado')?'si':'no'; modalEdit.classList.add('open'); }
function cerrarModal(){modalEdit.classList.remove('open'); editId=null;}
function guardarEdicion(){
 if(!editId) return;
 const isSi=ePagado.value==='si';
 const tipo=eTipo.value;
 const vOld=ventas.find(x=>x.id===editId);
 const cobro = vOld.tarifaCongelada!=null? vOld.tarifaCongelada : getTarifaCongelada(vOld);
 const valor=parseFloat(eValor.value||0);
 const tot=isSi?cobro:0;
 db.ref('ventas/'+editId).update({cliente:eCliente.value,tipo:tipo,repartidor:eRepa.value,precio:valor,total:tot,yaPago:isSi,estado:isSi?'Pagado':'Debe',tarifaCongelada:cobro}).then(()=>cerrarModal());
}
function eliminar(id){ if(confirm('¿Eliminar?')) db.ref('ventas/'+id).remove(); }
fBuscar.addEventListener('keyup',e=>{if(e.key==='Enter') aplicarFiltros();});
</script>
</body>
</html>
