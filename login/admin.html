<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Registro de Venta - Kigo</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#111}
.top{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid #f0f0f0}
.hamb{width:30px;height:20px;display:flex;flex-direction:column;justify-content:space-between;border:none;background:transparent;padding:0;cursor:pointer}
.hamb span{height:3px;background:#111;border-radius:3px;width:100%;display:block}
.btn-cerrar{border:1.3px solid #e11d2a;border-radius:999px;padding:6px 12px;background:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.wrap{max-width:480px;margin:0 auto;padding:2px 18px 24px}
.title{font-family:'Segoe Script','Brush Script MT',cursive;font-size:32px;font-weight:900;margin:6px 0 14px;line-height:1;transform:rotate(-1deg)}
.title u{text-decoration:none;position:relative}
.title u:after{content:'';position:absolute;left:-4px;right:-8px;bottom:-5px;height:5px;background:#e11d2a;border-radius:999px;transform:rotate(-1.5deg)}
.lbl{font-size:12.5px;font-weight:600;margin:12px 0 5px;display:flex;align-items:center;gap:6px;color:#222}
.lbl svg{width:14px;height:14px;stroke:#111}
.field{position:relative}
.inp{width:100%;border:1.3px solid #e0e0e0;border-radius:999px;padding:11px 36px 11px 14px;font-size:14px;background:#fff;outline:none}
.inp:focus{border-color:#e11d2a}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#888;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;z-index:2}
.tipo{display:flex;gap:10px;margin-top:4px;width:100%}
.btn-tipo{flex:1 1 0;min-width:0;height:46px;border-radius:999px;padding:0 8px;font-weight:700;font-size:12.5px;border:1.5px solid #111;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent;appearance:none;line-height:1}
.btn-tipo.active{background:#e11d2a;color:#fff;border-color:#e11d2a;box-shadow:0 3px 10px rgba(225,29,42,.2)}
.btn-tipo svg{width:15px;height:15px}
.total{background:#edeff2;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.total-lab{font-family:'Segoe Script',cursive;font-size:24px;font-weight:900;position:relative}
.total-lab:after{content:'';position:absolute;left:0;bottom:2px;width:100%;height:4px;background:#e11d2a;border-radius:999px}
.total-val{font-size:20px;font-weight:900;color:#e11d2a}
.btn-reg{width:100%;margin-top:14px;background:#e11d2a;color:#fff;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 12px rgba(225,29,42,.2)}
.btn-reg svg{width:16px;height:16px}
.toast-exito{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#111;color:#fff;padding:12px 18px;border-radius:999px;display:flex;align-items:center;gap:10px;z-index:9999;opacity:0;transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13.5px;font-weight:700;white-space:nowrap}
.toast-exito.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-exito .check{width:22px;height:22px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center}
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:100}
.menu-bg.open{display:block}
.menu{position:fixed;left:0;top:0;bottom:0;width:280px;background:#fff;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:101;padding:0;display:flex;flex-direction:column;box-shadow:10px 0 30px rgba(0,0,0,.15)}
.menu.open{transform:translateX(0)}
.menu-head{padding:16px 16px 12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.menu-logo{font-family:'Segoe Script',cursive;font-size:22px;font-weight:900}
.menu-logo span{color:#e11d2a}
.menu-close{width:28px;height:28px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.menu-body{flex:1;overflow:auto;padding:10px 10px}
.menu-sec{font-size:10px;font-weight:800;letter-spacing:.7px;color:#9ca3af;margin:12px 8px 6px;text-transform:uppercase}
.m-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:10px;border:none;background:transparent;text-align:left;font-size:13.5px;font-weight:600;color:#111;cursor:pointer;text-decoration:none}
.m-item:hover{background:#f9fafb}
.m-item.active{background:#e11d2a;color:#fff}
.m-item .ico{width:18px;display:flex;align-items:center;justify-content:center}
.m-item .ico svg{width:16px;height:16px}
.menu-foot{padding:10px;border-top:1px solid #f0f0f0}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:14px;margin-top:5px;z-index:20;max-height:160px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.s-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f3f3f3;font-size:13px}
</style>
</head>
<body>
<div class="top">
<button class="hamb" onclick="openM()"><span></span><span></span><span></span></button>
<button class="btn-cerrar" onclick="cerrarSesion()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar sesión</button>
</div>

<div class="menu-bg" id="menuBg" onclick="closeM()"></div>
<div class="menu" id="menu">
<div class="menu-head"><div class="menu-logo">Kigo <span>X</span>press</div><button class="menu-close" onclick="closeM()">✕</button></div>
<div class="menu-body">
<div class="menu-sec">Ventas</div>
<button class="m-item active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span> Registro de Venta</button>
<a class="m-item" href="cotizaciones.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span> Cotizaciones</a>
<a class="m-item" href="historial.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Historial de pedidos</a>
<div class="menu-sec">Gestión</div>
<a class="m-item" href="clientes.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Clientes</a>
<a class="m-item" href="presupuesto.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span> Presupuesto</a>
<a class="m-item" href="repartidores.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M5 17.5h12M5 17.5V14a2 2 0 0 1 2-2h6M18.5 17.5V11h-4"/></svg></span> Repartidores</a>
<div class="menu-sec">Sistema</div>
<a class="m-item" href="configuracion.html"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span> Configuración</a>
</div>
<div class="menu-foot"><button class="m-item" style="color:#e11d2a" onclick="cerrarSesion()"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Cerrar sesión</button></div>
</div>

<div class="wrap">
<div id="vRegistro">
<div class="title"><u>Registro de Venta</u></div>

<div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Nombre del Cliente</div>
<div class="field">
<input id="cliente" class="inp" placeholder="Ej: Brayan cuello" oninput="calcTotal(); filtrarSug(this.value)" autocomplete="off">
<button type="button" class="clear" onclick="clearF('cliente')">✕</button>
<div id="sugBox" class="suggest"></div>
</div>

<div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Fecha</div>
<div class="field">
<input id="fechaVenta" type="date" class="inp">
<button type="button" class="clear" onclick="clearF('fechaVenta')">✕</button>
</div>

<div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a2 2 0 0 1 2-2h2"/><path d="M5 17.5V13h5"/></svg> Tipo de Servicio</div>
<div class="tipo">
<button type="button" id="btnMoto" class="btn-tipo active" onclick="setTipo('moto')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M5 17.5V14a2 2 0 0 1 2-2h6M18.5 17.5V11h-4M13 8l2-3"/></svg> Moto Mandado</button>
<button type="button" id="btnTrans" class="btn-tipo" onclick="setTipo('transporte')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 6v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Transporte</button>
</div>  
<div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg> Precio</div>
<div class="field">
<input id="precio" type="number" class="inp" placeholder="$ 0.00" oninput="calcTotal()">
<button type="button" class="clear" onclick="clearF('precio')">✕</button>
</div>

<div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11v6M12 11v6"/></svg> Repartidor</div>
<div class="field">
<select id="repartidor" class="inp"><option value="">Seleccionar repartidor</option></select>
<button type="button" class="clear" onclick="clearF('repartidor')">✕</button>
</div>

<div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="10" y1="9" x2="14" y2="15"/><circle cx="12" cy="12" r="0.5"/></svg> Descuento</div>
<div class="field">
<input id="descuento" type="number" class="inp" placeholder="$ 0.00 (opcional)" oninput="calcTotal()">
<button type="button" class="clear" onclick="clearF('descuento')">✕</button>
</div>

<div class="total"><span class="total-lab">Total</span><span id="totalTxt" class="total-val">$ 0.00</span></div>
<button type="button" class="btn-reg" onclick="registrarVenta()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke="currentColor"><path d="M5 12l5 5l10-10"/></svg> Registrar Venta</button>
</div>
</div>

<div id="toastExito" class="toast-exito"><span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 12l5 5l10-10"/></svg></span> Registro Exitoso</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM", authDomain: "registro-ventas-kigo.firebaseapp.com", databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com", projectId: "registro-ventas-kigo", storageBucket: "registro-ventas-kigo.firebasestorage.app", messagingSenderId: "494693818399", appId: "1:494693818399:web:34312307ec5cd52190752a" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
(function(){ if(localStorage.getItem('kigo_rol')!=='admin'){ location.href='../index.html'; } })();
function cerrarSesion(){ localStorage.clear(); location.href='../index.html'; }
function openM(){ document.getElementById('menu').classList.add('open'); document.getElementById('menuBg').classList.add('open'); }
function closeM(){ document.getElementById('menu').classList.remove('open'); document.getElementById('menuBg').classList.remove('open'); }
let tipoActual='moto';
function clearF(id){ const el=document.getElementById(id); el.value=''; if(el.tagName==='SELECT') el.selectedIndex=0; calcTotal(); if(id==='cliente') document.getElementById('sugBox').style.display='none'; }
function setTipo(t){ tipoActual=t; document.getElementById('btnMoto').classList.toggle('active', t==='moto'); document.getElementById('btnTrans').classList.toggle('active', t==='transporte'); }
function calcTotal(){ let p=parseFloat(document.getElementById('precio').value)||0; let d=parseFloat(document.getElementById('descuento').value)||0; let tot=p-d; if(tot<0) tot=0; document.getElementById('totalTxt').innerText='$ '+tot.toFixed(2); return tot; }
document.getElementById('fechaVenta').value=new Date().toISOString().split('T')[0];
let ventasCache=[], clientesDB={}, repartidoresDB={};
function getTarifa(nombre, tipo){ const e=Object.values(repartidoresDB).find(r=>r.nombre===nombre); if(!e) return null; return tipo==='moto'?parseFloat(e.tarifaM)||5:parseFloat(e.tarifaT)||80; }
function refreshReps(){ const sel=document.getElementById('repartidor'); const lista=Object.values(repartidoresDB).map(r=>r.nombre); const u=[...new Set(lista)]; sel.innerHTML='<option value="">Seleccionar repartidor</option>'+u.map(r=>`<option value="${r}">${r}</option>`).join(''); }
db.ref('clientes').on('value',s=>{ clientesDB=s.val()||{}; });
db.ref('repartidores').on('value',s=>{ repartidoresDB=s.val()||{}; refreshReps(); });
db.ref('clientes').on('value',s=>{ clientesDB=s.val()||{}; });
db.ref('repartidores').on('value',s=>{ repartidoresDB=s.val()||{}; refreshReps(); });
db.ref('ventas').on('value',snap=>{ const val=snap.val()||{}; ventasCache=Object.entries(val).map(([id,v])=>({id,...v})); });
function obtenerNombres(){ const s=new Set(); Object.values(clientesDB).forEach(c=>{ if(c.nombre) s.add(c.nombre); }); ventasCache.forEach(v=>{ if(v.cliente) s.add(v.cliente); }); return [...s]; }

function mostrarExito(){ const t=document.getElementById('toastExito'); t.classList.add('show'); setTimeout(()=>{ t.classList.remove('show'); },2000); }

function limpiarForm(){ document.getElementById('cliente').value=''; document.getElementById('precio').value=''; document.getElementById('descuento').value=''; document.getElementById('repartidor').selectedIndex=0; document.getElementById('totalTxt').innerText='$ 0.00'; document.getElementById('sugBox').style.display='none'; setTipo('moto'); document.getElementById('fechaVenta').value=new Date().toISOString().split('T')[0]; }

function registrarVenta(){
let cliente=document.getElementById('cliente').value.trim();
let fecha=document.getElementById('fechaVenta').value;
let precio=parseFloat(document.getElementById('precio').value)||0;
let repartidor=document.getElementById('repartidor').value;
let total=calcTotal();
if(!cliente||!fecha||precio<=0){ alert('Completa datos'); return; }
let tarifa=getTarifa(repartidor, tipoActual);
let paga=tarifa!==null?tarifa:5;
const data={
cliente, tipo:tipoActual, precio,
descuento:parseFloat(document.getElementById('descuento').value)||0,
total, pagaKigo:paga, pagaKigoBase:paga, ganancia:total-paga,
repartidor, fecha, timestamp:Date.now(), estado:'Pagado',
pedido:'#'+Math.floor(1000+Math.random()*9000)
};
db.ref('ventas').push(data).then(()=>{
mostrarExito();
limpiarForm();
});
}

window.filtrarSug = function(q){
const box=document.getElementById('sugBox');
if(!q){ box.style.display='none'; return; }
const todos=obtenerNombres();
const f=todos.filter(n=>n.toLowerCase().includes(q.toLowerCase())).slice(0,6);
if(!f.length){ box.style.display='none'; return; }
box.innerHTML=f.map(n=>`<div class="s-item" onclick="selCli('${n.replace(/'/g,"\\'")}')">${n}</div>`).join('');
box.style.display='block';
}
function selCli(n){ document.getElementById('cliente').value=n; document.getElementById('sugBox').style.display='none'; }
</script>
</body>
</html>
