<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Registro de Venta - Kigo</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#111}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid #f0f0f0}
.hamb{width:34px;height:24px;display:flex;flex-direction:column;justify-content:space-between;border:none;background:transparent;padding:0;cursor:pointer;flex-shrink:0}
.hamb span{height:4px;background:#111;border-radius:3px;width:100%;display:block;transition:.2s}
.btn-cerrar{border:1.6px solid #e11d2a;border-radius:999px;padding:8px 16px;background:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.wrap{max-width:500px;margin:0 auto;padding:4px 20px 30px}
.title{font-family:'Segoe Script','Brush Script MT',cursive;font-size:44px;font-weight:900;margin:6px 0 18px;line-height:1;transform:rotate(-1deg)}
.title u{text-decoration:none;position:relative}
.title u:after{content:'';position:absolute;left:-4px;right:-10px;bottom:-6px;height:7px;background:#e11d2a;border-radius:999px;transform:rotate(-1.5deg)}
.lbl{font-size:15px;font-weight:600;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.field{position:relative}
.inp{width:100%;border:1.6px solid #e0e0e0;border-radius:999px;padding:14px 44px 14px 18px;font-size:16px;background:#fff;outline:none}
.inp:focus{border-color:#e11d2a}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1.2px solid #ddd;background:#fff;color:#888;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;z-index:2}
/* FIX BOTONES MOTO/TRANSPORTE - NO SE DEFORMAN */
.tipo{ display:flex; gap:12px; margin-top:4px; width:100%; }
.btn-tipo{
  flex:1 1 0;
  min-width:0;
  height:54px;
  border-radius:999px;
  padding:0 10px;
  font-weight:800;
  font-size:14px;
  border:1.8px solid #111;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  line-height:1;
}
.btn-tipo:active{ transform:scale(0.98); }
.btn-tipo.active{ background:#e11d2a; color:#fff; border-color:#e11d2a; box-shadow:0 4px 12px rgba(225,29,42,.25); }
.btn-tipo:not(.active):hover{ background:#fafafa; }
.total{background:#edeff2;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.total-lab{font-family:'Segoe Script',cursive;font-size:34px;font-weight:900;position:relative}
.total-lab:after{content:'';position:absolute;left:0;bottom:2px;width:100%;height:5px;background:#e11d2a;border-radius:999px}
.total-val{font-size:28px;font-weight:900;color:#e11d2a}
.btn-reg{width:100%;margin-top:16px;background:#e11d2a;color:#fff;border:none;border-radius:999px;padding:16px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 6px 16px rgba(225,29,42,.25)}
/* MENU LATERAL IZQUIERDA - NUEVO */
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:100;backdrop-filter:blur(2px)}
.menu-bg.open{display:block}
.menu{position:fixed;left:0;top:0;bottom:0;width:300px;background:#fff;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:101;padding:0;display:flex;flex-direction:column;box-shadow:10px 0 30px rgba(0,0,0,.18)}
.menu.open{transform:translateX(0)}
.menu-head{padding:20px 20px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.menu-logo{font-family:'Segoe Script',cursive;font-size:28px;font-weight:900}
.menu-logo span{color:#e11d2a}
.menu-close{width:32px;height:32px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-body{flex:1;overflow:auto;padding:14px 12px}
.menu-sec{font-size:11px;font-weight:800;letter-spacing:.8px;color:#9ca3af;margin:14px 10px 8px;text-transform:uppercase}
.m-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border-radius:12px;border:none;background:transparent;text-align:left;font-size:15px;font-weight:600;color:#111;cursor:pointer;text-decoration:none;transition:.15s}
.m-item:hover{background:#f9fafb}
.m-item.active{background:#e11d2a;color:#fff}
.m-item .ico{width:22px;text-align:center}
.menu-foot{padding:14px 12px;border-top:1px solid #f0f0f0}
.suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:16px;margin-top:6px;z-index:20;max-height:180px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.s-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #f3f3f3}
</style>
</head>
<body>
<div class="top">
<button class="hamb" onclick="openM()" aria-label="Menu"><span></span><span></span><span></span></button>
<button class="btn-cerrar" onclick="cerrarSesion()">↪ Cerrar sesión</button>
</div>
<div class="menu-bg" id="menuBg" onclick="closeM()"></div>
<div class="menu" id="menu">
<div class="menu-head">
<div class="menu-logo">Kigo <span>X</span>press</div>
<button class="menu-close" onclick="closeM()">✕</button>
</div>
<div class="menu-body">
<div class="menu-sec">Ventas</div>
<!-- Registro no lleva ruta porque ya estas ahi -->
<button class="m-item active" onclick="closeM()"><span class="ico">📋</span> Registro de Venta</button>
<a class="m-item" href="cotizaciones.html"><span class="ico">🧾</span> Cotizaciones</a>
<a class="m-item" href="historial.html"><span class="ico">🕒</span> Historial de pedidos</a>

<div class="menu-sec">Gestión</div>
<a class="m-item" href="clientes.html"><span class="ico">👥</span> Clientes</a>
<a class="m-item" href="presupuesto.html"><span class="ico">💰</span> Presupuesto</a>
<a class="m-item" href="repartidores.html"><span class="ico">🏍️</span> Repartidores</a>

<div class="menu-sec">Sistema</div>
<a class="m-item" href="configuracion.html"><span class="ico">⚙️</span> Configuración</a>
</div>
<div class="menu-foot">
<button class="m-item" style="color:#e11d2a" onclick="cerrarSesion()"><span class="ico">🚪</span> Cerrar sesión</button>
</div>
</div>

<div class="wrap">
<div id="vRegistro">
<div class="title"><u>Registro de Venta</u></div>

<div class="lbl"><span>👤</span> Nombre del Cliente</div>
<div class="field">
<input id="cliente" class="inp" placeholder="Ej: Juan Pérez" oninput="calcTotal(); filtrarSug(this.value)" autocomplete="off">
<button type="button" class="clear" onclick="clearF('cliente')">✕</button>
<div id="sugBox" class="suggest"></div>
</div>

<div class="lbl"><span>📅</span> Fecha</div>
<div class="field">
<input id="fechaVenta" type="date" class="inp">
<button type="button" class="clear" onclick="clearF('fechaVenta')">✕</button>
</div>

<div class="lbl"><span>🏍️</span> Tipo de Servicio</div>
<div class="tipo">
<!-- FIX: type=button para que no se deformen -->
<button type="button" id="btnMoto" class="btn-tipo active" onclick="setTipo('moto')">🏍️ Moto Mandado</button>
<button type="button" id="btnTrans" class="btn-tipo" onclick="setTipo('transporte')">🚚 Transporte</button>
</div>

<div class="lbl"><span>🏷️</span> Precio</div>
<div class="field">
<input id="precio" type="number" class="inp" placeholder="$ 0.00" oninput="calcTotal()">
<button type="button" class="clear" onclick="clearF('precio')">✕</button>
</div>
